[project]
name = "cursor-cli-agent"
version = "0.1.0"
description = "Thin Dockerized HTTP wrapper for the Cursor Agent CLI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
