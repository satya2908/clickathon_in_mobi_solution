# Template only. Do not commit a filled-in copy.
#
# Everything secret lives here and nothing secret lives in the ConfigMap, which is what makes
# the ConfigMap safe to commit, diff, and review. Create the real Secret out of band:
#
#   kubectl -n verdict create secret generic verdict-secrets \
#     --from-literal=CLICKHOUSE_PASSWORD='...' \
#     --from-literal=LLM_API_KEY='...'
#
# or point External Secrets / Vault / SOPS at the same key names.
apiVersion: v1
kind: Secret
metadata:
  name: verdict-secrets
  labels:
    app.kubernetes.io/name: verdict
type: Opaque
stringData:
  CLICKHOUSE_PASSWORD: ""
  LLM_API_KEY: ""
  HYPERDX_API_KEY: ""
